# DeskcommCRM — stack para o COOLIFY (build pack "Docker Compose").
#
# Deriva do docker-compose.prod.yml, com três diferenças, todas pelo mesmo
# motivo: no Coolify quem publica o domínio e o HTTPS é o Traefik do próprio
# painel, e quem escreve o .env são as variáveis cadastradas nele.
#
#   1. SEM `caddy`. O Traefik do Coolify já faz o papel de borda. O Caddy aqui
#      não tinha Caddyfile válido (o Coolify cria o bind mount vazio), morria em
#      loop, e a proteção de crash-loop do Coolify derrubava a stack INTEIRA.
#      A rota global do WAHA continua fechada para a internet sem ele: o app
#      responde 404 a quem chega por proxy de borda (lib/http/ip-do-cliente.ts).
#   2. SEM os serviços de voz/telefonia (`wacalls`, `asterisk`, `voice-agent`):
#      dependem de profile, de arquivos de configuração no host e de portas UDP
#      publicadas — nada disso existe neste deploy.
#   3. SEM `build:` em worker e scheduler. Com `build:` + `pull_policy: always`
#      o Coolify construía as duas imagens (minutos de pnpm install) e em
#      seguida as substituía pela do registro. Aqui todas vêm do registro.
#
# Versão PINADA (1.87.0) nas três imagens nossas, e não `:stable`: o schema do
# banco é aplicado à mão a partir do supabase/baseline.sql desta versão. Com
# `:stable` uma release nova trocaria o código sem o schema acompanhar.
# Para atualizar: subir o fork, reaplicar o baseline e trocar a tag aqui (ou
# APP_IMAGE / WORKER_IMAGE / SCHEDULER_IMAGE nas variáveis do Coolify).
#
# No Coolify: Docker Compose Location = /docker-compose.coolify.yml e domínio
# só no serviço `app` (https://seu.dominio:3000).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    mem_limit: 768m
    image: ${APP_IMAGE:-ghcr.io/melgarafael/deskcommcrm:1.87.0}
    pull_policy: ${APP_PULL_POLICY:-missing}
    restart: unless-stopped
    env_file: .env
    environment:
      SUPABASE_DB_ADMIN_URL: ""
      EVENT_LOG_WORKER_DRAINS: ${EVENT_LOG_WORKER_DRAINS:-true}
    depends_on:
      srh:
        condition: service_started
      waha:
        condition: service_started
    healthcheck:
      # Probe TCP puro, como no prod.yml: /api/v1/health dá 503 quando WAHA ou
      # Redis caem, e o Traefik tiraria o CRM do ar por uma dependência secundária.
      test: ["CMD", "node", "-e", "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *default-logging
    networks: [internal]

  worker:
    mem_limit: 512m
    image: ${WORKER_IMAGE:-ghcr.io/melgarafael/deskcomm-worker:1.87.0}
    pull_policy: ${WORKER_PULL_POLICY:-missing}
    restart: unless-stopped
    env_file: .env
    environment:
      WAHA_API_BASE_URL: http://waha:3000
      SUPABASE_DB_ADMIN_URL: ""
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging
    networks: [internal]

  waha:
    mem_limit: 1280m
    image: ${WAHA_IMAGE:-devlikeapro/waha:latest-2026.7.2}
    restart: unless-stopped
    environment:
      # O WAHA recebe o HASH; o app manda o texto puro (WAHA_API_KEY).
      WAHA_API_KEY: "sha512:${WAHA_API_KEY_SHA512}"
      WHATSAPP_HOOK_URL: http://app:3000/api/v1/webhooks/waha
      WHATSAPP_HOOK_EVENTS: "message.any,message.ack,message.edited,message.revoked,message.reaction,session.status,state.change"
      WHATSAPP_HOOK_HMAC_KEY: ${WAHA_HMAC_SECRET}
      WHATSAPP_DEFAULT_ENGINE: ${WHATSAPP_DEFAULT_ENGINE:-NOWEB}
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_RESTART_ALL_SESSIONS: "${WHATSAPP_RESTART_ALL_SESSIONS:-True}"
    volumes:
      - waha-data:/app/.sessions
      - waha-media:/app/.media
    logging: *default-logging
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
      # Sem isto o primeiro ping só sai depois de 30 s, e o `up -d` fica parado
      # esperando o srh (que depende do redis saudável).
      start_period: 10s
      start_interval: 2s
    logging: *default-logging
    networks: [internal]

  srh:
    # Mesmo digest do prod.yml (ver o comentário de lá).
    image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN}
      SRH_CONNECTION_STRING: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging
    networks: [internal]

  scheduler:
    image: ${SCHEDULER_IMAGE:-ghcr.io/melgarafael/deskcomm-scheduler:1.87.0}
    pull_policy: ${SCHEDULER_PULL_POLICY:-missing}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      TZ: UTC
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    logging: *default-logging
    networks: [internal]

volumes:
  waha-data:
  waha-media:

networks:
  internal:
    driver: bridge
